sonar.projectKey=penpot-fork
sonar.projectName=penpot-fork
sonar.sources=frontend,backend,common,exporter
sonar.exclusions=**/node_modules/**,**/vendor/**,**/resources/public/js/**,**/*.min.js,**/scripts/**,**/test/**,**/playground/**,frontend/resources/wasm-playground/**,frontend/resources/polyfills/**,frontend/packages/mousetrap/**,frontend/packages/draft-js/**,frontend/playwright/**
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# sonar-clojure (typmk): relatório gerado por sonarqube/analisar.sh
sonar.clojure.kondo.reportPaths=target/clj-kondo.json
# O plugin 0.1.4 quebra ao montar a tabela de símbolos de
# backend/src/app/rpc/commands/audit.clj; apontar para um arquivo
# inexistente desliga só a navegação de símbolos.
sonar.clojure.kondo.analysisPaths=target/no-analysis.json
